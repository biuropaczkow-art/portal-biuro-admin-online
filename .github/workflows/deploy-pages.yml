name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site with Vite
        run: npx vite build --config deploy/vps/vite.config.ts

      - name: Setup SPA routing fallback for GitHub Pages
        run: |
          cp deploy/vps/site/index.html deploy/vps/site/404.html
          mkdir -p deploy/vps/site/demo deploy/vps/site/auth/callback
          cp deploy/vps/site/index.html deploy/vps/site/demo/index.html
          cp deploy/vps/site/index.html deploy/vps/site/auth/callback/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy/vps/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
